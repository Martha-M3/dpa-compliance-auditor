<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a new password - KenyaDPA Audit</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <main class="login-page">
    <div class="login-card">

      <div class="brand-mark">
        <div class="logo-square">K</div>
        <h1>Choose a new password</h1>
        <p>Use at least {{ min_length }} characters.</p>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <ul class="flash-list">
            {% for category, message in messages %}
              <li class="flash {{ category }}">{{ message }}</li>
            {% endfor %}
          </ul>
        {% endif %}
      {% endwith %}

      <form method="post">
        <div class="field">
          <label for="password">New password</label>
          <input type="password" id="password" name="password" autocomplete="new-password" minlength="{{ min_length }}" required autofocus>
        </div>
        <div class="field">
          <label for="confirm">Confirm new password</label>
          <input type="password" id="confirm" name="confirm" autocomplete="new-password" minlength="{{ min_length }}" required>
        </div>
        <button type="submit" class="btn-primary">Update password</button>
      </form>

      <a class="link-small auth-back" href="{{ url_for('auth.login') }}">&larr; Back to sign in</a>
    </div>
  </main>
</body>
</html>
